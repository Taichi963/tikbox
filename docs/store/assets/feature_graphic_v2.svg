<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 500" width="1024" height="500">
  <!--
    案2: シンプル・グラデーションバンド型
    - ダークネイビー背景
    - 左端に縦グラデーション帯（ブランドカラー）
    - 中央に大きめのアプリ名テキスト
    - 右側に音声波形イラスト
  -->
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#0A0B1C"/>
      <stop offset="100%" stop-color="#080917"/>
    </linearGradient>

    <!-- Left accent band gradient -->
    <linearGradient id="bandGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#CC00FF"/>
      <stop offset="40%"  stop-color="#6600DD"/>
      <stop offset="100%" stop-color="#0A0B1C" stop-opacity="0"/>
    </linearGradient>

    <!-- Cyan horizontal band -->
    <linearGradient id="cyanBand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#0A0B1C" stop-opacity="0"/>
      <stop offset="60%"  stop-color="#0044AA"/>
      <stop offset="100%" stop-color="#00D4FF"/>
    </linearGradient>

    <!-- Glow for text -->
    <filter id="glow2" x="-10%" y="-30%" width="120%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Wave path glow -->
    <filter id="waveGlow" x="-5%" y="-50%" width="110%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- ===== BACKGROUND ===== -->
  <rect width="1024" height="500" fill="url(#bg2)"/>

  <!-- Left magenta/purple accent band -->
  <rect x="0" y="0" width="280" height="500" fill="url(#bandGrad)" opacity="0.35"/>

  <!-- Right cyan accent band -->
  <rect x="744" y="0" width="280" height="500" fill="url(#cyanBand)" opacity="0.35"/>

  <!-- Thin horizontal line top -->
  <line x1="0" y1="148" x2="1024" y2="148" stroke="#8822FF" stroke-width="1.2" opacity="0.22"/>
  <line x1="0" y1="352" x2="1024" y2="352" stroke="#00D4FF" stroke-width="1.2" opacity="0.22"/>

  <!-- Left vertical accent stripe -->
  <rect x="0" y="0" width="6" height="500" fill="#CC00FF" opacity="0.70"/>
  <rect x="12" y="80" width="3" height="340" fill="#9900CC" opacity="0.45"/>

  <!-- Right vertical accent stripe -->
  <rect x="1018" y="0" width="6" height="500" fill="#00D4FF" opacity="0.70"/>
  <rect x="1009" y="80" width="3" height="340" fill="#0099BB" opacity="0.45"/>

  <!-- ===== HORIZONTAL SOUND WAVE (center-right area) ===== -->
  <!-- Three concentric sine curves at right side, fading out -->
  <g filter="url(#waveGlow)">
    <!-- Wave 1 (innermost) -->
    <path d="M 680 250 Q 710 218 740 250 Q 770 282 800 250 Q 830 218 860 250 Q 890 282 920 250 Q 950 218 980 250 Q 1010 282 1024 265"
      stroke="#00D4FF" stroke-width="2.5" fill="none" opacity="0.85"/>
    <!-- Wave 2 -->
    <path d="M 680 250 Q 710 200 740 250 Q 770 300 800 250 Q 830 200 860 250 Q 890 300 920 250 Q 950 200 980 250 Q 1010 300 1024 270"
      stroke="#0099CC" stroke-width="2" fill="none" opacity="0.50"/>
    <!-- Wave 3 (outermost, most faded) -->
    <path d="M 680 250 Q 710 176 740 250 Q 770 324 800 250 Q 830 176 860 250 Q 890 324 920 250 Q 950 176 980 250 Q 1010 324 1024 278"
      stroke="#006699" stroke-width="1.5" fill="none" opacity="0.28"/>
  </g>

  <!-- Purple horizontal wave on left -->
  <g filter="url(#waveGlow)">
    <path d="M 0 250 Q 30 218 60 250 Q 90 282 120 250 Q 150 218 180 250 Q 210 282 240 250 Q 270 218 300 250 Q 330 282 344 265"
      stroke="#CC44FF" stroke-width="2.5" fill="none" opacity="0.80"/>
    <path d="M 0 250 Q 30 200 60 250 Q 90 300 120 250 Q 150 200 180 250 Q 210 300 240 250 Q 270 200 300 250 Q 330 300 344 268"
      stroke="#9922CC" stroke-width="2" fill="none" opacity="0.45"/>
  </g>

  <!-- ===== CHAT BUBBLE (left-center area, above text) ===== -->
  <g>
    <!-- Bubble body -->
    <rect x="378" y="100" width="90" height="58" rx="14" fill="white" opacity="0.92"/>
    <!-- Bubble tail -->
    <polygon points="400,158 384,176 424,158" fill="white" opacity="0.92"/>
    <!-- Dots -->
    <circle cx="398" cy="129" r="5.5" fill="#0C1240"/>
    <circle cx="423" cy="129" r="5.5" fill="#0C1240"/>
    <circle cx="448" cy="129" r="5.5" fill="#0C1240"/>
  </g>

  <!-- ===== APP NAME ===== -->
  <text x="512" y="255"
    font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
    font-size="82" font-weight="900"
    fill="#FFFFFF"
    text-anchor="middle"
    letter-spacing="1"
    filter="url(#glow2)">LiveVoice Box</text>

  <!-- Thin accent under app name -->
  <line x1="240" y1="268" x2="784" y2="268" stroke="#00D4FF" stroke-width="2" opacity="0.50"/>

  <!-- ===== SUBTITLE ===== -->
  <text x="512" y="316"
    font-family="'Helvetica Neue', Helvetica, 'Hiragino Sans', 'Yu Gothic', 'Noto Sans JP', Arial, sans-serif"
    font-size="26" font-weight="300"
    fill="#99CCFF"
    text-anchor="middle"
    opacity="0.88">ライブ配信 コメント読み上げサポート</text>

  <!-- ===== OPERATOR NAME ===== -->
  <text x="512" y="460"
    font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
    font-size="16"
    fill="#667799"
    text-anchor="middle"
    opacity="0.65">LiveVoice Studio</text>
</svg>

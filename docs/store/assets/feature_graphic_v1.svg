<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 500" width="1024" height="500">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#0E1028"/>
      <stop offset="100%" stop-color="#060813"/>
    </linearGradient>

    <!-- Purple/magenta bar gradient (top bright, bottom faded) -->
    <linearGradient id="purpleGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#DD44FF"/>
      <stop offset="45%"  stop-color="#9900CC"/>
      <stop offset="100%" stop-color="#550088" stop-opacity="0.15"/>
    </linearGradient>

    <!-- Cyan bar gradient -->
    <linearGradient id="cyanGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#33EEFF"/>
      <stop offset="45%"  stop-color="#0099CC"/>
      <stop offset="100%" stop-color="#004488" stop-opacity="0.15"/>
    </linearGradient>

    <!-- Glow filter for bars -->
    <filter id="barGlow" x="-60%" y="-20%" width="220%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Glow filter for main text -->
    <filter id="textGlow" x="-15%" y="-30%" width="130%" height="160%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Subtle glow for icon elements -->
    <filter id="subtleGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- ===== BACKGROUND ===== -->
  <rect width="1024" height="500" fill="url(#bg)"/>

  <!-- Center ambient glow (subtle depth) -->
  <ellipse cx="512" cy="275" rx="380" ry="210" fill="#0B1645" opacity="0.55"/>
  <ellipse cx="512" cy="275" rx="200" ry="130" fill="#0D1E55" opacity="0.30"/>

  <!-- ===== LEFT SOUND BARS (PURPLE/MAGENTA) — 10 bars, center y=265 ===== -->
  <!-- bar width=8, gap=6 → step=14, x start=36, bar end=36+9*14+8=170 -->
  <g filter="url(#barGlow)">
    <rect x="36"  y="225" width="8" height="80"  fill="url(#purpleGrad)" rx="4"/>
    <rect x="50"  y="195" width="8" height="140" fill="url(#purpleGrad)" rx="4"/>
    <rect x="64"  y="175" width="8" height="180" fill="url(#purpleGrad)" rx="4"/>
    <rect x="78"  y="155" width="8" height="220" fill="url(#purpleGrad)" rx="4"/>
    <rect x="92"  y="185" width="8" height="160" fill="url(#purpleGrad)" rx="4"/>
    <rect x="106" y="180" width="8" height="170" fill="url(#purpleGrad)" rx="4"/>
    <rect x="120" y="155" width="8" height="220" fill="url(#purpleGrad)" rx="4"/>
    <rect x="134" y="175" width="8" height="180" fill="url(#purpleGrad)" rx="4"/>
    <rect x="148" y="195" width="8" height="140" fill="url(#purpleGrad)" rx="4"/>
    <rect x="162" y="222" width="8" height="86"  fill="url(#purpleGrad)" rx="4"/>
  </g>

  <!-- ===== RIGHT SOUND BARS (CYAN) — 10 bars, mirrored, x from 850 ===== -->
  <!-- x start=850, ends at 850+9*14+8=988 -->
  <g filter="url(#barGlow)">
    <rect x="850" y="222" width="8" height="86"  fill="url(#cyanGrad)" rx="4"/>
    <rect x="864" y="195" width="8" height="140" fill="url(#cyanGrad)" rx="4"/>
    <rect x="878" y="175" width="8" height="180" fill="url(#cyanGrad)" rx="4"/>
    <rect x="892" y="155" width="8" height="220" fill="url(#cyanGrad)" rx="4"/>
    <rect x="906" y="180" width="8" height="170" fill="url(#cyanGrad)" rx="4"/>
    <rect x="920" y="185" width="8" height="160" fill="url(#cyanGrad)" rx="4"/>
    <rect x="934" y="155" width="8" height="220" fill="url(#cyanGrad)" rx="4"/>
    <rect x="948" y="175" width="8" height="180" fill="url(#cyanGrad)" rx="4"/>
    <rect x="962" y="195" width="8" height="140" fill="url(#cyanGrad)" rx="4"/>
    <rect x="976" y="225" width="8" height="80"  fill="url(#cyanGrad)" rx="4"/>
  </g>

  <!-- ===== CHAT BUBBLE ICON (top center) ===== -->
  <g filter="url(#subtleGlow)">
    <!-- Bubble body -->
    <rect x="460" y="44" width="104" height="68" rx="16" fill="white" opacity="0.95"/>
    <!-- Bubble tail (pointing down-left) -->
    <polygon points="490,112 472,134 514,112" fill="white" opacity="0.95"/>
    <!-- Three dots -->
    <circle cx="490" cy="78" r="6" fill="#0C1240"/>
    <circle cx="512" cy="78" r="6" fill="#0C1240"/>
    <circle cx="534" cy="78" r="6" fill="#0C1240"/>
    <!-- Sound arcs to the right of bubble -->
    <path d="M 568 68 Q 580 78 568 88"   stroke="#33EEFF" stroke-width="3.5" fill="none" stroke-linecap="round" opacity="0.90"/>
    <path d="M 572 60 Q 592 78 572 96"   stroke="#33EEFF" stroke-width="3"   fill="none" stroke-linecap="round" opacity="0.70"/>
    <path d="M 576 52 Q 605 78 576 104"  stroke="#33EEFF" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.45"/>
  </g>

  <!-- ===== THIN SEPARATOR LINE ===== -->
  <line x1="330" y1="158" x2="694" y2="158" stroke="#00D4FF" stroke-width="1.2" opacity="0.35"/>

  <!-- ===== APP NAME ===== -->
  <text x="512" y="235"
    font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
    font-size="78" font-weight="900"
    fill="#00D4FF"
    text-anchor="middle"
    letter-spacing="2"
    filter="url(#textGlow)">LiveVoice Box</text>

  <!-- ===== SUBTITLE ===== -->
  <text x="512" y="284"
    font-family="'Helvetica Neue', Helvetica, 'Hiragino Sans', 'Yu Gothic', 'Noto Sans JP', Arial, sans-serif"
    font-size="26" font-weight="400"
    fill="#FFFFFF"
    text-anchor="middle"
    opacity="0.82">ライブ配信 コメント読み上げサポート</text>

  <!-- ===== THIN SEPARATOR LINE ===== -->
  <line x1="330" y1="306" x2="694" y2="306" stroke="#00D4FF" stroke-width="1.2" opacity="0.35"/>

  <!-- ===== BOTTOM WAVEFORM (abstract sine) ===== -->
  <path d="M 280 390 Q 310 372 340 390 Q 370 408 400 390 Q 430 372 460 390 Q 490 408 520 390 Q 550 372 580 390 Q 610 408 640 390 Q 670 372 700 390 Q 730 408 744 390"
    stroke="#00D4FF" stroke-width="2" fill="none" opacity="0.28"/>

  <!-- ===== OPERATOR NAME ===== -->
  <text x="512" y="454"
    font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
    font-size="17" font-weight="400"
    fill="#8899BB"
    text-anchor="middle"
    opacity="0.60">LiveVoice Studio</text>
</svg>

name: tikbox
description: TikTok comment reader with TTS

publish_to: 'none'

version: 1.0.0+3

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # 状態管理
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # TTS
  flutter_tts: ^4.0.2

  # 音声再生（BGMや効果音用）
  audioplayers: ^6.0.0

  # 永続化
  shared_preferences: ^2.2.3

  # 画面スリープ防止
  wakelock_plus: ^1.2.5
  audio_service: ^0.18.15
  in_app_purchase: ^3.2.0
  path_provider: ^2.1.5
  share_plus: ^10.0.2

  # ユーティリティ
  uuid: ^4.3.3
  collection: ^1.18.0
  web_socket_channel: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.9
  riverpod_generator: ^2.4.0

flutter:
  uses-material-design: true
  assets:
    - assets/audio/
